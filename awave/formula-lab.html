      if(!factsOk){ allOk = false; message = message || 'Check which value is which fact — one or more isn\'t right yet.'; }
    }

    var targetIdEls = card.querySelectorAll('.target-id-input');
    if(targetIdEls.length){
      var targetIdOk = true;
      targetIdEls.forEach(function(el){
        var field = el.getAttribute('data-target-field');
        var ok = identifyFieldOk('lambda', field, el.value);
        el.classList.remove('ok','bad');
        el.classList.add(ok ? 'ok' : 'bad');
        if(!ok) targetIdOk = false;
      });
      if(!targetIdOk){ allOk = false; message = message || 'Check the name, symbol and unit of what you\'re finding.'; }
    }

    var knownFactEls = card.querySelectorAll('.known-fact-input');
    if(knownFactEls.length){
      var knownFactsOk = true;
      knownFactEls.forEach(function(el){
        var k = el.getAttribute('data-fact-key');
        var field = el.getAttribute('data-fact-field');
        var ok;
        if(field === 'value'){
          var correctVal = current[k];
          var typedVal = normalizeNumber(el.value);
          ok = !isNaN(typedVal) && Math.abs(typedVal - correctVal) <= Math.max(0.02*Math.abs(correctVal), 0.03);
        } else {
          ok = identifyFieldOk(k, field, el.value);
        }
        el.classList.remove('ok','bad');
        el.classList.add(ok ? 'ok' : 'bad');
        if(!ok) knownFactsOk = false;
      });
      if(!knownFactsOk){ allOk = false; message = message || 'One of your known facts (value, name, symbol or unit) isn\'t right yet.'; }
    }

    var origOk = FORMULA_OK.indexOf(normalizeFormula(origFormulaEl.value)) !== -1;
    origFormulaEl.classList.remove('ok','bad');
    origFormulaEl.classList.add(origOk ? 'ok' : 'bad');
    if(!origOk){ allOk = false; message = message || 'That\'s not the formula that applies here — check again.'; }

    var formulaRaw = formulaEl.value.trim().toLowerCase() === 'same' ? origFormulaEl.value : formulaEl.value;
    var formulaOk = FORMULA_OK.indexOf(normalizeFormula(formulaRaw)) !== -1;
    formulaEl.classList.remove('ok','bad');
    formulaEl.classList.add(formulaOk ? 'ok' : 'bad');
    if(!formulaOk){ allOk = false; message = message || 'The rearranged formula isn\'t quite right yet — try again.'; }

    var typed = normalizeNumber(answerEl.value);
    var answerOk = !isNaN(typed) && Math.abs(typed - current.correct) <= Math.max(0.02*Math.abs(current.correct), 0.03);
    answerEl.classList.remove('ok','bad');
    answerEl.classList.add(answerOk ? 'ok' : 'bad');
    if(!answerOk){ allOk = false; message = message || 'Not quite — check your substitution and try again.'; }

    var unitOk = identifyFieldOk('lambda', 'unit', answerUnitEl.value);
    answerUnitEl.classList.remove('ok','bad');
    answerUnitEl.classList.add(unitOk ? 'ok' : 'bad');
    if(!unitOk){ allOk = false; message = message || 'Don\'t forget to write the unit — check it matches your answer.'; }

    asked++;
    if(allOk){
      score++;
      updateScore();
      checkBtn.disabled = true;
      var correctModal = document.getElementById('correctModal');
      correctModal.hidden = false;
      setTimeout(function(){
        correctModal.hidden = true;
        if(asked >= ROUND_SIZE){ showRoundDone(); } else { newProblem(); }
      }, 1000);
    } else {
      feedback.textContent = message;
      asked--;
    }
  }

  function updateScore(){
    document.getElementById('scoreBadge-sclosed').innerHTML = '<b>'+score+'</b> / '+ROUND_SIZE+' correct this round';
  }

  function showRoundDone(){
    var modal = document.getElementById('roundDoneModal');
    var title = document.getElementById('roundDoneTitle');
    var summary = document.getElementById('roundDoneSummary');
    var btn = document.getElementById('roundDoneBtn');
    if(score === ROUND_SIZE){
      title.textContent = "Perfect round!";
      summary.textContent = "All " + ROUND_SIZE + " correct — you've got λ = 4L/n solid in this mode.";
    } else {
      title.textContent = "Round complete";
      summary.textContent = score + " out of " + ROUND_SIZE + " correct. Have another go to lock it in.";
    }
    btn.onclick = function(){ modal.hidden = true; startRound(); };
    modal.hidden = false;
    btn.focus();
  }

  function startRound(){
    score = 0; asked = 0;
    updateScore();
    newProblem();
  }

  document.getElementById('newRoundBtn-sclosed').addEventListener('click', startRound);

  var panel = document.querySelector('.topic-panel[data-topic="standing-closed"]');
  var modeButtons = panel.querySelectorAll('.mode-btn');
  function updateModeButtons(){
    modeButtons.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-mode') === FIELD_MODE); });
  }
  modeButtons.forEach(function(b){
    b.addEventListener('click', function(){
      var m = b.getAttribute('data-mode');
      if(m === FIELD_MODE) return;
      FIELD_MODE = m;
      updateModeButtons();
      startRound();
    });
  });
  updateModeButtons();

  window.formulaLabTopics = window.formulaLabTopics || [];
  window.formulaLabTopics.push(startRound);

  startRound();
})();
</script>

<script>
(function(){
  "use strict";

  // colours match wave-lab.html's Interference tab (d, n, theta) and
  // Basic Wave (lambda -- same physical quantity), per colorkey.txt
  var CLR = {
    d:{light:'#4A3F9E',dark:'#9088E0'}, n:{light:'#A8871F',dark:'#E0C25C'},
    theta:{light:'#7A3E9E',dark:'#C79AE0'}, lambda:{light:'#2569B0',dark:'#6FB1F2'}
  };
  var LABEL = { d:'d', n:'n', theta:'θ', lambda:'λ' };
  var NAME = { d:'slit separation', n:'order number', theta:'angle', lambda:'wavelength' };
  var UNIT = { d:'m', n:'—', theta:'°', lambda:'m' };
  var ORDINALS = { 1:'1st', 2:'2nd', 3:'3rd' };

  function colorOf(key){ return isDarkMode() ? CLR[key].dark : CLR[key].light; }

  var THETA_VALUES = [20,25,30,35,40,45,50,55];
  var D_VALUES = [0.3,0.4,0.5,0.6,0.8,1.0];
  var N_VALUES = [1,2,3];

  // d sinθ = nλ is on the real formula sheet, but the real papers (per
  // the fork's research) usually give an angle to a numbered maximum,
  // not a screen distance -- so this tab solves for theta or lambda,
  // deriving lambda FROM a chosen valid angle so sin() never goes out
  // of range, rather than picking d/n/lambda independently and hoping.
  var SCENARIOS_REAL = {
    theta: [
      "A diffraction grating has slits separated by {d} m. Light of wavelength {lambda} m produces a bright fringe at the {nOrd} order. Find the angle to this fringe.",
      "A grating with slit separation {d} m is used with light of wavelength {lambda} m. Calculate the angle to the {nOrd} order maximum.",
      "Light of wavelength {lambda} m passes through a grating with {d} m between slits. Find the angle to the {nOrd} order bright band."
    ],
    lambda: [
      "A diffraction grating has slits separated by {d} m. The {nOrd} order maximum is observed at an angle of {theta}°. Find the wavelength of the light.",
      "A grating with slit separation {d} m produces its {nOrd} order maximum at {theta}° from the centre. Calculate the wavelength used.",
      "Light passing through a grating with {d} m between slits forms a bright fringe at {theta}° in the {nOrd} order. Find the wavelength of the light."
    ]
  };
  var SCENARIOS_DND = {
    theta: [
      "An enchanted crystal lattice has rune-slits separated by {d} m. Light from a wizard's lantern, wavelength {lambda} m, produces a bright fringe at the {nOrd} order. Find the angle to this fringe.",
      "A gemstone grating with slit separation {d} m is used with enchanted light of wavelength {lambda} m. Calculate the angle to the {nOrd} order maximum.",
      "Light of wavelength {lambda} m from a fae lantern passes through a crystal grating with {d} m between slits. Find the angle to the {nOrd} order bright band."
    ],
    lambda: [
      "An enchanted crystal lattice has rune-slits separated by {d} m. The {nOrd} order maximum glows at an angle of {theta}°. Find the wavelength of the light.",
      "A gemstone grating with slit separation {d} m produces its {nOrd} order maximum at {theta}° from the centre. Calculate the wavelength used.",
      "Light from a wizard's lantern passing through a crystal grating with {d} m between slits forms a bright fringe at {theta}° in the {nOrd} order. Find the wavelength of the light."
    ]
  };
  var SCENARIOS = {
    theta: SCENARIOS_REAL.theta.concat(SCENARIOS_DND.theta),
    lambda: SCENARIOS_REAL.lambda.concat(SCENARIOS_DND.lambda)
  };

  var NAME_ALIASES = {
    d: ['slit separation', 'source separation', 'slit spacing', 'slit distance'],
    n: ['order number', 'order', 'fringe number', 'maximum number'],
    theta: ['angle', 'diffraction angle', 'angle to the fringe'],
    lambda: ['wavelength', 'wave length']
  };
  var SYMBOL_ALIASES = {
    d: ['d'],
    n: ['n'],
    theta: ['θ', 'theta'],
    lambda: ['λ', 'lambda']
  };
  var UNIT_ALIASES = {
    d: ['m', 'metre', 'metres', 'meter', 'meters'],
    n: ['none', 'no unit', 'unitless', 'dimensionless', '-', 'nounit'],
    theta: ['degrees', 'degree', 'deg', '°'],
    lambda: ['m', 'metre', 'metres', 'meter', 'meters']
  };
  function identifyFieldOk(key, field, raw){
    var list = field === 'name' ? NAME_ALIASES[key] : (field === 'symbol' ? SYMBOL_ALIASES[key] : UNIT_ALIASES[key]);
    return list.map(normalizeGuess).indexOf(normalizeGuess(raw)) !== -1;
  }
  function normalizeFormula(s){
    return (s||'').toString().trim().toLowerCase()
      .replace(/λ/g,'lambda')
      .replace(/θ/g,'theta')
      .replace(/[×✕✗\*]/g,'')
      .replace(/÷/g,'/')
      .replace(/\s+/g,'');
  }

  var FORMULA_ORIGINAL_OK = ['dsintheta=nlambda', 'dsin(theta)=nlambda'];
  var FORMULA_SHEET_OPTIONS = [
    'v = f λ',
    'f = 1 / T',
    'd sinθ = n λ',
    'n λ = dx / L',
    "f ' = f × vW ÷ (vW ± vS)"
  ];

  var FORMULA_OK_BY_TARGET = {
    theta: ['theta=asin(nlambda/d)', 'theta=asin((nlambda)/d)'],
    lambda: ['lambda=dsintheta/n', 'lambda=dsin(theta)/n', 'lambda=(dsintheta)/n']
  };
  var FORMULA_DISPLAY_BY_TARGET = { theta:'θ = asin(nλ ÷ d)', lambda:'λ = d sinθ ÷ n' };
  var FORMULA_CHOICES_BY_TARGET = {
    theta: ['θ = asin(nλ ÷ d)', 'θ = sin(nλ ÷ d)', 'θ = nλ ÷ d'],
    lambda: ['λ = d sinθ ÷ n', 'λ = d ÷ (n sinθ)', 'λ = n sinθ ÷ d']
  };

  var FIELD_MODE = 'learner';
  var score = 0, asked = 0;
  var ROUND_SIZE = 6;
  var current = null;

  function newProblem(){
    var theta = pick(THETA_VALUES);
    var d = pick(D_VALUES);
    var n = pick(N_VALUES);
    var lambdaExact = d * Math.sin(theta * Math.PI/180) / n;
    var target = pick(['theta','lambda']);
    var scenario, correct;
    if(target === 'theta'){
      var lambdaShown = Math.round(lambdaExact * 1000) / 1000;
      scenario = pick(SCENARIOS.theta).replace('{d}', d).replace('{nOrd}', ORDINALS[n]).replace('{lambda}', lambdaShown);
      current = { d:d, n:n, lambda:lambdaShown, theta:theta, target:'theta', correct:theta, scenario:scenario };
    } else {
      scenario = pick(SCENARIOS.lambda).replace('{d}', d).replace('{nOrd}', ORDINALS[n]).replace('{theta}', theta);
      current = { d:d, n:n, theta:theta, lambda:lambdaExact, target:'lambda', correct:lambdaExact, scenario:scenario };
    }
    renderProblem();
  }

  function renderProblem(){
    var card = document.getElementById('problemCard-int');
    var t = current.target;
    var givenKeys = ['d','n','theta','lambda'].filter(function(k){ return k !== t; });

    var learnerFactsHtml = givenKeys.map(function(k){
      return '<span class="fact-chip" style="color:'+colorOf(k)+';border-color:'+colorOf(k)+'">'
        + LABEL[k] + ' = ' + current[k] + ' ' + UNIT[k] + '</span>';
    }).join('');

    var factGuessHtml = '';
    if(FIELD_MODE === 'confident'){
      factGuessHtml = '<div class="fact-guess-grid">' + givenKeys.map(function(k){
        return '<div class="fact-guess">' +
          '<span class="fact-value-chip">' + current[k] + ' ' + UNIT[k] + '</span>' +
          '<div class="id-grid id-grid-2">' +
            '<div class="id-field"><label>Name</label><input class="fact-guess-input" data-fact-key="'+k+'" data-fact-guess-field="name" autocomplete="off" spellcheck="false" placeholder="name"></div>' +
            '<div class="id-field"><label>Symbol</label>' + buildGreekInputHtml('class="fact-guess-input" data-fact-key="'+k+'" data-fact-guess-field="symbol"', 'symbol') + '</div>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>';
    }

    var factsRowHtml = '';
    if(FIELD_MODE !== 'expert'){
      var findHtml = '<span class="find-chip" style="color:'+colorOf(t)+';border-color:'+colorOf(t)+'">Find: '
        + LABEL[t] + ' (' + NAME[t] + ')</span>';
      factsRowHtml = '<div class="facts-row">' + (FIELD_MODE === 'learner' ? learnerFactsHtml : '') + findHtml + '</div>';
    }

    var targetIdHtml = '';
    var knownFactsHtml = '';
    if(FIELD_MODE === 'expert'){
      targetIdHtml =
        '<div class="id-block">' +
          '<p class="id-block-label">What are you trying to find?</p>' +
          '<div class="id-grid id-grid-3">' +
            '<div class="id-field"><label>Name</label><input class="target-id-input" data-target-field="name" autocomplete="off" spellcheck="false"></div>' +
            '<div class="id-field"><label>Symbol</label>' + buildGreekInputHtml('class="target-id-input" data-target-field="symbol"', '') + '</div>' +
            '<div class="id-field"><label>Unit</label><input class="target-id-input" data-target-field="unit" autocomplete="off" spellcheck="false"></div>' +
          '</div>' +
        '</div>';
      knownFactsHtml =
        '<div class="id-block">' +
          '<p class="id-block-label">What do you know? (write down every fact from the question)</p>' +
          givenKeys.map(function(k, idx){
            return '<div class="known-fact-block">' +
              '<p class="known-fact-heading">Fact ' + (idx+1) + '</p>' +
              '<div class="id-grid id-grid-4">' +
                '<div class="id-field"><label>Value</label><input class="known-fact-input" data-fact-key="'+k+'" data-fact-field="value" autocomplete="off" inputmode="decimal" placeholder="0.00"></div>' +
                '<div class="id-field"><label>Name</label><input class="known-fact-input" data-fact-key="'+k+'" data-fact-field="name" autocomplete="off" spellcheck="false"></div>' +
                '<div class="id-field"><label>Symbol</label>' + buildGreekInputHtml('class="known-fact-input" data-fact-key="'+k+'" data-fact-field="symbol"', '') + '</div>' +
                '<div class="id-field"><label>Unit</label><input class="known-fact-input" data-fact-key="'+k+'" data-fact-field="unit" autocomplete="off" spellcheck="false"></div>' +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>';
    }

    var origFormulaHtml = '';
    if(FIELD_MODE === 'learner'){
      var sheetOptHtml = '<option value="">— choose —</option>' + shuffle(FORMULA_SHEET_OPTIONS).map(function(o){
        return '<option value="'+o+'">'+o+'</option>';
      }).join('');
      origFormulaHtml =
        '<div class="field-row">' +
          '<label>Which formula from your sheet applies here?</label>' +
          '<select id="origFormulaInput-int">'+sheetOptHtml+'</select>' +
          '<p class="field-hint">These are the real formulae from the NCEA wave-systems reference sheet — in the exam you\'ll see all of them at once and have to pick the right one, same as here.</p>' +
        '</div>';
    } else {
      origFormulaHtml =
        '<div class="field-row">' +
          '<label>Original formula (before rearranging)</label>' +
          buildFormulaInputHtml('origFormulaInput-int', '') +
          '<p class="field-hint">Write it exactly as printed on your formula sheet.</p>' +
        '</div>';
    }

    var formulaFieldHtml = '';
    if(FIELD_MODE === 'learner'){
      var opts = shuffle(FORMULA_CHOICES_BY_TARGET[t]);
      var optHtml = '<option value="">— choose —</option>' + opts.map(function(o){ return '<option value="'+o+'">'+o+'</option>'; }).join('');
      formulaFieldHtml =
        '<div class="field-row">' +
          '<label>Rearranged formula</label>' +
          '<select id="formulaInput-int">'+optHtml+'</select>' +
        '</div>';
    } else {
      formulaFieldHtml =
        '<div class="field-row">' +
          '<label>Rearranged formula (write it before you substitute &mdash; or type &quot;same&quot; if it is already in the right order)</label>' +
          buildFormulaInputHtml('formulaInput-int', FIELD_MODE === 'confident' ? 'e.g. '+FORMULA_DISPLAY_BY_TARGET[t] : '') +
          '<p class="field-hint">Use × or * for multiply, ÷ or / for divide, and asin(...) for inverse sine.</p>' +
        '</div>';
    }

    card.innerHTML =
      '<p class="problem-text">' + current.scenario + '</p>' +
      factsRowHtml +
      targetIdHtml +
      knownFactsHtml +
      factGuessHtml +
      origFormulaHtml +
      formulaFieldHtml +
      '<div class="field-row">' +
        '<label>Working (optional — show your substitution)</label>' +
        '<input id="workingInput-int" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. 5 / 12">' +
      '</div>' +
      '<div class="field-row">' +
        '<label>Your answer</label>' +
        '<div class="answer-row">' +
          '<input id="answerInput-int" class="answer-value-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">' +
          '<input id="answerUnitInput-int" class="answer-unit-input" type="text" autocomplete="off" spellcheck="false" placeholder="unit">' +
          buildCalculatorHtml() +
        '</div>' +
      '</div>' +
      '<div class="actions-row">' +
        '<button class="check-btn" id="checkBtn-int" type="button">Check</button>' +
        '<span class="feedback" id="feedback-int" aria-live="polite"></span>' +
      '</div>';

    document.getElementById('checkBtn-int').addEventListener('click', checkAnswer);
    var answerInput = document.getElementById('answerInput-int');
    answerInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); checkAnswer(); } });
    var answerUnitInput = document.getElementById('answerUnitInput-int');
    answerUnitInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); checkAnswer(); } });
    var origFormulaInput = document.getElementById('origFormulaInput-int');
    origFormulaInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); checkAnswer(); } });
    var formulaInput = document.getElementById('formulaInput-int');
    formulaInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); checkAnswer(); } });
    var workingInput = document.getElementById('workingInput-int');
    workingInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); checkAnswer(); } });
    wireGreekPopups(card);
    wireCalculator(card);

    var focusEl = card.querySelector('.target-id-input') || card.querySelector('.fact-guess-input') || origFormulaInput || formulaInput || answerInput;
    focusEl.focus();
  }

  function checkAnswer(){
    var t = current.target;
    var card = document.getElementById('problemCard-int');
    var origFormulaEl = document.getElementById('origFormulaInput-int');
    var formulaEl = document.getElementById('formulaInput-int');
    var answerEl = document.getElementById('answerInput-int');
    var answerUnitEl = document.getElementById('answerUnitInput-int');
    var feedback = document.getElementById('feedback-int');
    var checkBtn = document.getElementById('checkBtn-int');

    var allOk = true;
    var message = '';

    var factGuessEls = card.querySelectorAll('.fact-guess-input');
    if(factGuessEls.length){
      var factsOk = true;
      factGuessEls.forEach(function(el){
        var k = el.getAttribute('data-fact-key');
        var field = el.getAttribute('data-fact-guess-field');
        var ok = identifyFieldOk(k, field, el.value);
        el.classList.remove('ok','bad');
        el.classList.add(ok ? 'ok' : 'bad');
        if(!ok) factsOk = false;
      });
      if(!factsOk){ allOk = false; message = message || 'Check which value is which fact — one or more isn\'t right yet.'; }
    }

    var targetIdEls = card.querySelectorAll('.target-id-input');
    if(targetIdEls.length){
      var targetIdOk = true;
      targetIdEls.forEach(function(el){
        var field = el.getAttribute('data-target-field');
        var ok = identifyFieldOk(t, field, el.value);
        el.classList.remove('ok','bad');
        el.classList.add(ok ? 'ok' : 'bad');
        if(!ok) targetIdOk = false;
      });
      if(!targetIdOk){ allOk = false; message = message || 'Check the name, symbol and unit of what you\'re finding.'; }
    }

    var knownFactEls = card.querySelectorAll('.known-fact-input');
    if(knownFactEls.length){
      var knownFactsOk = true;
      knownFactEls.forEach(function(el){
        var k = el.getAttribute('data-fact-key');
        var field = el.getAttribute('data-fact-field');
        var ok;
        if(field === 'value'){
          var correctVal = current[k];
          var typedVal = normalizeNumber(el.value);
          ok = !isNaN(typedVal) && Math.abs(typedVal - correctVal) <= Math.max(0.02*Math.abs(correctVal), 0.03);
        } else {
          ok = identifyFieldOk(k, field, el.value);
        }
        el.classList.remove('ok','bad');
        el.classList.add(ok ? 'ok' : 'bad');
        if(!ok) knownFactsOk = false;
      });
      if(!knownFactsOk){ allOk = false; message = message || 'One of your known facts (value, name, symbol or unit) isn\'t right yet.'; }
    }

    var origOk = FORMULA_ORIGINAL_OK.indexOf(normalizeFormula(origFormulaEl.value)) !== -1;
    origFormulaEl.classList.remove('ok','bad');
    origFormulaEl.classList.add(origOk ? 'ok' : 'bad');
    if(!origOk){ allOk = false; message = message || 'That\'s not the formula that applies here — check your sheet again.'; }

    var formulaRaw = formulaEl.value.trim().toLowerCase() === 'same' ? origFormulaEl.value : formulaEl.value;
    var formulaOk = FORMULA_OK_BY_TARGET[t].indexOf(normalizeFormula(formulaRaw)) !== -1;
    formulaEl.classList.remove('ok','bad');
    formulaEl.classList.add(formulaOk ? 'ok' : 'bad');
    if(!formulaOk){ allOk = false; message = message || 'The rearranged formula isn\'t quite right yet — try again.'; }

    var typed = normalizeNumber(answerEl.value);
    var answerOk = !isNaN(typed) && Math.abs(typed - current.correct) <= Math.max(0.02*Math.abs(current.correct), 0.03);
    answerEl.classList.remove('ok','bad');
    answerEl.classList.add(answerOk ? 'ok' : 'bad');
    if(!answerOk){ allOk = false; message = message || 'Not quite — check your substitution and try again.'; }

    var unitOk = identifyFieldOk(t, 'unit', answerUnitEl.value);
    answerUnitEl.classList.remove('ok','bad');
    answerUnitEl.classList.add(unitOk ? 'ok' : 'bad');
    if(!unitOk){ allOk = false; message = message || 'Don\'t forget to write the unit — check it matches your answer.'; }

    asked++;
    if(allOk){
      score++;
      updateScore();
      checkBtn.disabled = true;
      var correctModal = document.getElementById('correctModal');
      correctModal.hidden = false;
      setTimeout(function(){
        correctModal.hidden = true;
        if(asked >= ROUND_SIZE){ showRoundDone(); } else { newProblem(); }
      }, 1000);
    } else {
      feedback.textContent = message;
      asked--;
    }
  }

  function updateScore(){
    document.getElementById('scoreBadge-int').innerHTML = '<b>'+score+'</b> / '+ROUND_SIZE+' correct this round';
  }

  function showRoundDone(){
    var modal = document.getElementById('roundDoneModal');
    var title = document.getElementById('roundDoneTitle');
    var summary = document.getElementById('roundDoneSummary');
    var btn = document.getElementById('roundDoneBtn');
    if(score === ROUND_SIZE){
      title.textContent = "Perfect round!";
      summary.textContent = "All " + ROUND_SIZE + " correct — you've got d sinθ = nλ solid in this mode.";
    } else {
      title.textContent = "Round complete";
      summary.textContent = score + " out of " + ROUND_SIZE + " correct. Have another go to lock it in.";
    }
    btn.onclick = function(){ modal.hidden = true; startRound(); };
    modal.hidden = false;
    btn.focus();
  }

  function startRound(){
    score = 0; asked = 0;
    updateScore();
    newProblem();
  }

  document.getElementById('newRoundBtn-int').addEventListener('click', startRound);

  var panel = document.querySelector('.topic-panel[data-topic="interference"]');
  var modeButtons = panel.querySelectorAll('.mode-btn');
  function updateModeButtons(){
    modeButtons.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-mode') === FIELD_MODE); });
  }
  modeButtons.forEach(function(b){
    b.addEventListener('click', function(){
      var m = b.getAttribute('data-mode');
      if(m === FIELD_MODE) return;
      FIELD_MODE = m;
      updateModeButtons();
      startRound();
    });
  });
  updateModeButtons();

  window.formulaLabTopics = window.formulaLabTopics || [];
  window.formulaLabTopics.push(startRound);

  startRound();
})();
</script>

<script>
(function(){
  "use strict";
  var tabButtons = document.querySelectorAll('.tab-btn');
  tabButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      if(btn.disabled) return;
      var id = btn.getAttribute('data-topic');
      tabButtons.forEach(function(b){ b.classList.toggle('active', b === btn); });
      document.querySelectorAll('.topic-panel').forEach(function(p){
        p.hidden = (p.getAttribute('data-topic') !== id);
      });
    });
  });

  document.getElementById('newStudentBtn').addEventListener('click', function(){
    (window.formulaLabTopics || []).forEach(function(fn){ fn(); });
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      var modal = document.getElementById('roundDoneModal');
      if(!modal.hidden){ document.getElementById('roundDoneBtn').click(); }
    }
  });
})();
</script>
</body>
</html>
