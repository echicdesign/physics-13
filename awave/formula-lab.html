<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formula Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Trocchi&display=swap">
<style>
  :root{
    --bg:#F5F7F8;
    --surface:#FFFFFF;
    --surface-2:#EDF1F2;
    --ink:#1B2730;
    --ink-muted:#5B6870;
    --border:#D6DEE1;
    --accent:#0E6E6B;
    --on-accent:#F6FBFA;
    --input-line:#B6C1C5;
    --focus-ring: rgba(14,110,107,0.25);
    --bad:#B3432E;
    --good:#1E7A46;
    --clr-v:#C97324; --clr-f:#C23B3B; --clr-lambda:#2569B0;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10171B; --surface:#17222A; --surface-2:#1E2B31;
      --ink:#E7EEF0; --ink-muted:#9FB0B6; --border:#2B3C43;
      --accent:#4FD1C0; --on-accent:#082220;
      --input-line:#3A4B52; --focus-ring: rgba(79,209,192,0.28);
      --bad:#E5806A; --good:#5FCB8C;
      --clr-v:#F0A94E; --clr-f:#FF8A80; --clr-lambda:#6FB1F2;
    }
  }
  :root[data-theme="dark"]{
    --bg:#10171B; --surface:#17222A; --surface-2:#1E2B31;
    --ink:#E7EEF0; --ink-muted:#9FB0B6; --border:#2B3C43;
    --accent:#4FD1C0; --on-accent:#082220;
    --input-line:#3A4B52; --focus-ring: rgba(79,209,192,0.28);
    --bad:#E5806A; --good:#5FCB8C;
    --clr-v:#F0A94E; --clr-f:#FF8A80; --clr-lambda:#6FB1F2;
  }

  *{ box-sizing:border-box; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Public Sans', -apple-system, 'Segoe UI', sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:20px 22px 60px; }

  .title-row{ margin-bottom:12px; display:flex; align-items:baseline; flex-wrap:wrap; gap:10px; }
  h1{
    font-family:'Fraunces', Georgia, serif; font-weight:700;
    font-size:clamp(1.4rem,2.6vw,1.9rem); line-height:1.2; margin:0; display:inline;
    text-wrap:balance;
  }
  .eyebrow-inline{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; letter-spacing:0.04em;
    color:var(--ink-muted);
  }
  .nav-link{
    margin-left:auto; text-decoration:none; align-self:center;
  }

  button.danger-btn{
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem;
    color:var(--bad); background:var(--surface); border:1px solid var(--bad);
    border-radius:7px; padding:7px 12px; cursor:pointer;
  }
  button.danger-btn:hover{ background:var(--bad); color:#fff; }
  button.danger-btn:focus-visible{ outline:2px solid var(--bad); outline-offset:2px; }

  .tab-bar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .tab-btn{
    font-family:'Fraunces', serif; font-weight:600; font-size:0.95rem;
    padding:9px 18px; border-radius:10px 10px 0 0; border:1px solid var(--border);
    border-bottom:none; background:var(--surface-2); color:var(--ink-muted); cursor:pointer;
  }
  .tab-btn.active{ background:var(--surface); color:var(--ink); border-color:var(--accent); }
  .tab-btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .tab-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .topic-panel[hidden]{ display:none; }

  .toprow{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .badge{
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:999px; padding:5px 12px; color:var(--ink-muted);
  }
  .badge b{ color:var(--accent); }
  .mode-toggle{ display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; }
  .mode-btn{
    font-family:'IBM Plex Mono', monospace; font-size:0.75rem;
    padding:6px 13px; background:var(--surface); color:var(--ink-muted); border:none; cursor:pointer;
  }
  .mode-btn.active{ background:var(--accent); color:var(--on-accent); }
  .mode-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  button.ghost-btn, a.ghost-btn{
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem;
    color:var(--ink-muted); background:var(--surface); border:1px solid var(--border);
    border-radius:7px; padding:7px 12px; cursor:pointer; display:inline-block;
  }
  button.ghost-btn:hover, a.ghost-btn:hover{ color:var(--ink); border-color:var(--input-line); }
  button.ghost-btn:focus-visible, a.ghost-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .problem-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:24px 26px;
  }
  .problem-text{
    font-family:'Fraunces', serif; font-size:1.15rem; line-height:1.5;
    margin:0 0 18px; text-wrap:balance;
  }
  .facts-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:22px; }
  .fact-chip{
    font-family:'Trocchi', serif; font-size:0.95rem; font-weight:600;
    padding:8px 14px; border-radius:9px; border:1.5px solid; background:var(--surface-2);
  }
  .find-chip{
    font-family:'Trocchi', serif; font-size:0.95rem; font-weight:700;
    padding:8px 14px; border-radius:9px; border:1.5px dashed;
  }

  .id-block{ margin-bottom:22px; }
  .id-block-label{
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem; letter-spacing:0.02em;
    color:var(--ink-muted); margin:0 0 10px;
  }
  .id-grid{ display:grid; gap:12px; }
  .id-grid-2{ grid-template-columns:repeat(auto-fit, minmax(100px,1fr)); }
  .id-grid-3{ grid-template-columns:repeat(auto-fit, minmax(110px,1fr)); }
  .id-grid-4{ grid-template-columns:repeat(auto-fit, minmax(90px,1fr)); }
  .id-field{ display:flex; flex-direction:column; gap:6px; }
  .id-field label{
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem; letter-spacing:0.04em;
    text-transform:uppercase; color:var(--ink-muted);
  }
  .id-field input{
    font-family:'Trocchi', serif; font-size:0.92rem; color:var(--ink);
    background:var(--surface-2); border:1.5px solid var(--input-line); border-radius:9px;
    padding:9px 10px; width:100%; box-sizing:border-box;
  }
  .id-field input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--focus-ring); }
  .id-field input.ok{ border-color:var(--good); }
  .id-field input.bad{ border-color:var(--bad); }
  .known-fact-block{ margin-bottom:14px; }
  .known-fact-block:last-child{ margin-bottom:0; }
  .known-fact-heading{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; font-weight:600;
    text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-muted); margin:0 0 6px;
  }

  .field-row{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .field-row label{
    font-family:'IBM Plex Mono', monospace; font-size:0.74rem; letter-spacing:0.04em;
    text-transform:uppercase; color:var(--ink-muted);
  }
  .field-row input, .field-row select{
    font-family:'Trocchi', serif; font-size:1.05rem; color:var(--ink);
    background:var(--surface-2); border:1.5px solid var(--input-line); border-radius:9px;
    padding:12px 14px;
  }
  .field-row input:focus, .field-row select:focus{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--focus-ring);
  }
  .field-row input.ok, .field-row select.ok{ border-color:var(--good); }
  .field-row input.bad, .field-row select.bad{ border-color:var(--bad); }
  .field-hint{ font-size:0.8rem; color:var(--ink-muted); font-style:italic; margin:2px 0 0; }

  .fact-guess-grid{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .fact-guess{ display:flex; flex-direction:column; gap:8px; min-width:220px; flex:1 1 220px; }
  .fact-value-chip{
    font-family:'Trocchi', serif; font-size:0.95rem; font-weight:600;
    padding:8px 14px; border-radius:9px; border:1.5px solid var(--border);
    background:var(--surface-2); color:var(--ink); text-align:center;
  }
  .fact-guess label{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; letter-spacing:0.04em;
    text-transform:uppercase; color:var(--ink-muted);
  }
  .fact-guess-input{
    font-family:'Trocchi', serif; font-size:0.95rem; color:var(--ink);
    background:var(--surface-2); border:1.5px solid var(--input-line); border-radius:9px;
    padding:10px 12px;
  }
  .fact-guess-input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--focus-ring); }
  .fact-guess-input.ok{ border-color:var(--good); }
  .fact-guess-input.bad{ border-color:var(--bad); }

  .formula-input-wrap{ display:block; }
  .greek-wrap{ position:relative; display:inline-block; margin-top:8px; }
  .greek-trigger{
    font-family:'Public Sans', sans-serif; font-size:0.78rem; font-style:italic;
    background:none; border:none; border-bottom:1px dotted var(--ink-muted);
    padding:2px 0; cursor:pointer; color:var(--ink-muted);
  }
  .greek-trigger:hover{ color:var(--accent); border-bottom-color:var(--accent); }
  .greek-trigger:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .greek-popup{
    position:absolute; top:100%; left:0; margin-top:6px; z-index:20;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:8px; display:grid; grid-template-columns:repeat(3, 1fr); gap:6px;
    box-shadow:0 10px 28px rgba(0,0,0,0.25); min-width:230px;
  }
  .greek-popup[hidden]{ display:none; }
  .greek-opt{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    font-family:'IBM Plex Mono', monospace; font-size:1.15rem; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
    padding:8px 4px; cursor:pointer;
  }
  .greek-opt span{ font-family:'Public Sans', sans-serif; font-size:0.62rem; color:var(--ink-muted); font-style:italic; }
  .greek-opt:hover{ border-color:var(--accent); }
  .greek-opt:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .calc-wrap{ position:relative; display:inline-block; }
  .calc-trigger{
    font-family:'IBM Plex Mono', monospace; font-size:1rem; line-height:1;
    background:var(--surface-2); border:1.5px solid var(--input-line); border-radius:9px;
    padding:10px 12px; cursor:pointer; color:var(--ink-muted);
  }
  .calc-trigger:hover{ color:var(--ink); border-color:var(--accent); }
  .calc-trigger:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .calc-popup{
    position:absolute; bottom:100%; right:0; margin-bottom:8px; z-index:30;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px; box-shadow:0 12px 32px rgba(0,0,0,0.28); width:230px;
  }
  .calc-popup[hidden]{ display:none; }
  .calc-display{
    width:100%; box-sizing:border-box; font-family:'IBM Plex Mono', monospace;
    font-size:1.3rem; text-align:right; padding:10px 12px; margin-bottom:8px;
    border:1.5px solid var(--input-line); border-radius:8px; background:var(--surface-2);
    color:var(--ink);
  }
  .calc-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  .calc-btn{
    font-family:'IBM Plex Mono', monospace; font-size:1rem;
    padding:10px 0; border:1px solid var(--border); border-radius:7px;
    background:var(--surface-2); color:var(--ink); cursor:pointer;
  }
  .calc-btn:hover{ border-color:var(--accent); }
  .calc-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .calc-btn.calc-op{ color:var(--accent); font-weight:600; }
  .calc-btn.calc-clear{ color:var(--bad); }
  .calc-btn.calc-eq{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .calc-btn.calc-zero{ grid-column:span 2; }
  .calc-use-row{ margin-top:8px; }
  .calc-use-btn{
    width:100%; font-family:'IBM Plex Mono', monospace; font-size:0.82rem; font-weight:600;
    padding:9px 0; border:none; border-radius:8px; background:var(--accent); color:var(--on-accent);
    cursor:pointer;
  }
  .calc-use-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .answer-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .answer-row #answerInput{ flex:2 1 120px; }
  .answer-row .answer-unit-input{ flex:1 1 90px; }

  .actions-row{ display:flex; align-items:center; gap:12px; margin-top:20px; flex-wrap:wrap; }
  .check-btn{
    font-family:'IBM Plex Mono', monospace; font-size:0.9rem; font-weight:600;
    color:var(--on-accent); background:var(--accent); border:none;
    border-radius:9px; padding:11px 22px; cursor:pointer;
  }
  .check-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .feedback{ font-size:0.9rem; color:var(--ink-muted); }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.45);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal-box{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:30px 32px; max-width:420px; text-align:center;
    box-shadow:0 16px 50px rgba(0,0,0,0.3);
    animation: celebrate-pop 0.55s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes celebrate-pop{
    0%{ transform:scale(0.3) rotate(-20deg); opacity:0; }
    60%{ transform:scale(1.08) rotate(8deg); opacity:1; }
    80%{ transform:scale(0.96) rotate(-3deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }
  .modal-title{ font-family:'Fraunces', serif; font-weight:700; font-size:1.4rem; margin:0 0 12px; }
  .modal-summary{ color:var(--ink-muted); line-height:1.55; margin:0 0 22px; }
  .modal-box-compact{ padding:22px 34px; }
  .modal-box-compact .modal-title{ margin:0; color:var(--good); }
  .next-btn{
    font-family:'IBM Plex Mono', monospace; font-size:0.9rem; font-weight:600;
    color:var(--on-accent); background:var(--accent); border:none;
    border-radius:9px; padding:11px 26px; cursor:pointer;
  }
  .next-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
    .modal-box{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="title-row">
    <h1>Formula Lab</h1><span class="eyebrow-inline">AS91523 &middot; Wave Systems &middot; rearrange, substitute, solve</span>
    <a class="ghost-btn nav-link" href="../">&#127968; All tools</a>
  </div>

  <div class="toprow">
    <button class="ghost-btn danger-btn" id="newStudentBtn" type="button">New student &mdash; clear everything</button>
  </div>

  <div class="tab-bar" role="tablist">
    <button class="tab-btn active" data-topic="basic" type="button">Basic Wave</button>
    <button class="tab-btn" data-topic="beats" type="button">🧠 Beats</button>
    <button class="tab-btn" data-topic="doppler" type="button">Doppler Effect</button>
    <button class="tab-btn" data-topic="standing-open" type="button">🧠 Standing Waves &mdash; Open</button>
    <button class="tab-btn" data-topic="standing-closed" type="button">🧠 Standing Waves &mdash; Closed</button>
    <button class="tab-btn" data-topic="interference" type="button">Interference</button>
  </div>

  <script>
  // Shared helpers used by every topic's script below -- pure UI/utility
  // functions with no topic-specific data, so they're defined once here
  // instead of duplicated in each topic's own script block. (Topic data
  // like quantities, scenarios and formula banks stays duplicated per
  // topic on purpose -- see wave-lab.html's engine for why.)
  "use strict";

  window.formulaLabTopics = window.formulaLabTopics || [];

  function isDarkMode(){
    var explicit = document.documentElement.getAttribute('data-theme');
    if(explicit === 'dark') return true;
    if(explicit === 'light') return false;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=a[i]; a[i]=a[j]; a[j]=tmp; }
    return a;
  }
  function normalizeNumber(s){
    return parseFloat((s||'').toString().trim().replace(/[^0-9.\-]/g,''));
  }
  function normalizeGuess(s){
    return (s||'').toString().trim().toLowerCase().replace(/[^a-z0-9λθδμ]/gi,'');
  }

  // Greek letters a student will actually meet across NCEA L3 Physics
  // waves topics -- not exhaustive, just the ones actually used here.
  var GREEK_LETTERS = [
    { ch:'λ', name:'lambda' },
    { ch:'θ', name:'theta' },
    { ch:'Δ', name:'delta' },
    { ch:'μ', name:'mu' },
    { ch:'ω', name:'omega' },
    { ch:'Ω', name:'ohm' },
    { ch:'τ', name:'tau' },
    { ch:'ρ', name:'rho' },
    { ch:'α', name:'alpha' },
    { ch:'β', name:'beta' },
    { ch:'γ', name:'gamma' },
    { ch:'Φ', name:'phi' }
  ];

  function buildGreekHelper(){
    var optsHtml = GREEK_LETTERS.map(function(g){
      return '<button type="button" class="greek-opt" data-char="'+g.ch+'">'+g.ch+'<span>'+g.name+'</span></button>';
    }).join('');
    return '<div class="greek-wrap">' +
      '<button type="button" class="greek-trigger">Greek ▾</button>' +
      '<div class="greek-popup" hidden>'+optsHtml+'</div>' +
    '</div>';
  }
  // generic text input + Greek helper, addressed either by id (formula
  // fields) or by data-attributes (repeated fact/target fields)
  function buildGreekInputHtml(extraAttrs, placeholder){
    return '<div class="formula-input-wrap">' +
      '<input type="text" autocomplete="off" spellcheck="false" ' + extraAttrs +
        (placeholder ? ' placeholder="'+placeholder+'"' : '') + '>' +
      buildGreekHelper() +
    '</div>';
  }
  function buildFormulaInputHtml(id, placeholder){
    return buildGreekInputHtml('id="'+id+'"', placeholder);
  }
  function closeAllGreekPopups(){
    document.querySelectorAll('.greek-popup').forEach(function(p){ p.hidden = true; });
  }
  document.addEventListener('click', closeAllGreekPopups);
  function wireGreekPopups(scope){
    scope.querySelectorAll('.greek-wrap').forEach(function(wrap){
      var trigger = wrap.querySelector('.greek-trigger');
      var popup = wrap.querySelector('.greek-popup');
      trigger.addEventListener('click', function(e){
        e.stopPropagation();
        var wasOpen = !popup.hidden;
        closeAllGreekPopups();
        closeCalcPopup();
        popup.hidden = wasOpen;
      });
      popup.querySelectorAll('.greek-opt').forEach(function(opt){
        opt.addEventListener('click', function(e){
          e.stopPropagation();
          var input = wrap.parentElement.querySelector('input');
          if(input){
            var ch = opt.getAttribute('data-char');
            var start = input.selectionStart != null ? input.selectionStart : input.value.length;
            var end = input.selectionEnd != null ? input.selectionEnd : input.value.length;
            input.value = input.value.slice(0,start) + ch + input.value.slice(end);
            input.focus();
            input.selectionStart = input.selectionEnd = start + ch.length;
            input.classList.remove('ok','bad');
          }
          popup.hidden = true;
        });
      });
    });
  }

  // Simple four-function calculator, toggled beside the answer field --
  // real NCEA exams allow calculators, so this only removes arithmetic
  // friction, it doesn't do any of the actual physics for the student.
  // Scope-relative (class-based, not id-based) so it works identically
  // no matter which topic's card it's rendered inside.
  function buildCalculatorHtml(){
    return '<div class="calc-wrap">' +
      '<button type="button" class="calc-trigger" aria-label="Open calculator">🖩</button>' +
      '<div class="calc-popup" hidden>' +
        '<input class="calc-display" type="text" readonly value="0" aria-label="Calculator display">' +
        '<div class="calc-grid">' +
          '<button type="button" class="calc-btn calc-clear" data-calc-key="C">C</button>' +
          '<button type="button" class="calc-btn" data-calc-key="±">±</button>' +
          '<button type="button" class="calc-btn" data-calc-key="⌫">⌫</button>' +
          '<button type="button" class="calc-btn calc-op" data-calc-key="÷">÷</button>' +
          '<button type="button" class="calc-btn" data-calc-key="7">7</button>' +
          '<button type="button" class="calc-btn" data-calc-key="8">8</button>' +
          '<button type="button" class="calc-btn" data-calc-key="9">9</button>' +
          '<button type="button" class="calc-btn calc-op" data-calc-key="×">×</button>' +
          '<button type="button" class="calc-btn" data-calc-key="4">4</button>' +
          '<button type="button" class="calc-btn" data-calc-key="5">5</button>' +
          '<button type="button" class="calc-btn" data-calc-key="6">6</button>' +
          '<button type="button" class="calc-btn calc-op" data-calc-key="−">−</button>' +
          '<button type="button" class="calc-btn" data-calc-key="1">1</button>' +
          '<button type="button" class="calc-btn" data-calc-key="2">2</button>' +
          '<button type="button" class="calc-btn" data-calc-key="3">3</button>' +
          '<button type="button" class="calc-btn calc-op" data-calc-key="+">+</button>' +
          '<button type="button" class="calc-btn calc-zero" data-calc-key="0">0</button>' +
          '<button type="button" class="calc-btn" data-calc-key=".">.</button>' +
          '<button type="button" class="calc-btn calc-eq" data-calc-key="=">=</button>' +
        '</div>' +
        '<div class="calc-use-row">' +
          '<button type="button" class="calc-use-btn" type="button">Use this answer ↓</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
  function closeCalcPopup(){
    document.querySelectorAll('.calc-popup').forEach(function(p){ p.hidden = true; });
  }
  document.addEventListener('click', closeCalcPopup);
  function wireCalculator(scope){
    var wrap = scope.querySelector('.calc-wrap');
    if(!wrap) return;
    var trigger = wrap.querySelector('.calc-trigger');
    var popup = wrap.querySelector('.calc-popup');
    var display = wrap.querySelector('.calc-display');
    var useBtn = wrap.querySelector('.calc-use-btn');

    var current = '0', pending = null, pendingOp = null, awaitingNew = false;

    function render(){ display.value = current; }
    function compute(a, op, b){
      if(op === '+') return a + b;
      if(op === '−') return a - b;
      if(op === '×') return a * b;
      if(op === '÷') return b === 0 ? NaN : a / b;
      return b;
    }
    function pressDigit(d){
      if(current === 'Error' || awaitingNew || current === '0'){ current = d; awaitingNew = false; }
      else { current += d; }
      render();
    }
    function pressDot(){
      if(current === 'Error' || awaitingNew){ current = '0.'; awaitingNew = false; render(); return; }
      if(current.indexOf('.') === -1){ current += '.'; render(); }
    }
    function pressOp(op){
      var num = parseFloat(current);
      if(pendingOp !== null && !awaitingNew){
        num = compute(pending, pendingOp, num);
        current = isNaN(num) ? 'Error' : String(num);
        render();
      }
      pending = parseFloat(current);
      pendingOp = op;
      awaitingNew = true;
    }
    function pressEquals(){
      if(pendingOp === null) return;
      var num = parseFloat(current);
      var result = compute(pending, pendingOp, num);
      current = isNaN(result) ? 'Error' : String(result);
      pendingOp = null; pending = null; awaitingNew = true;
      render();
    }
    function pressClear(){
      current = '0'; pending = null; pendingOp = null; awaitingNew = false; render();
    }
    function pressBackspace(){
      if(current === 'Error' || awaitingNew) return;
      current = current.length > 1 ? current.slice(0,-1) : '0';
      render();
    }
    function pressSign(){
      if(current === '0' || current === 'Error') return;
      current = current.charAt(0) === '-' ? current.slice(1) : ('-' + current);
      render();
    }

    trigger.addEventListener('click', function(e){
      e.stopPropagation();
      var wasOpen = !popup.hidden;
      closeAllGreekPopups();
      closeCalcPopup();
      popup.hidden = wasOpen;
    });
    popup.addEventListener('click', function(e){ e.stopPropagation(); });
    popup.querySelectorAll('.calc-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-calc-key');
        if(key === 'C'){ pressClear(); }
        else if(key === '⌫'){ pressBackspace(); }
        else if(key === '±'){ pressSign(); }
        else if(key === '='){ pressEquals(); }
        else if(key === '+' || key === '−' || key === '×' || key === '÷'){ pressOp(key); }
        else if(key === '.'){ pressDot(); }
        else { pressDigit(key); }
      });
    });
    useBtn.addEventListener('click', function(){
      var answerInput = scope.querySelector('.answer-value-input');
      if(answerInput && current !== 'Error'){
        answerInput.value = current;
        answerInput.classList.remove('ok','bad');
      }
      popup.hidden = true;
    });
  }
  </script>

<script>
(function(){
  "use strict";
  var panel = document.querySelector('.topic-panel[data-topic="basic"]');

  var CLR = { v:{light:'#C97324',dark:'#F0A94E'}, f:{light:'#C23B3B',dark:'#FF8A80'}, lambda:{light:'#2569B0',dark:'#6FB1F2'} };
  var LABEL = { v:'v', f:'f', lambda:'λ' };
  var NAME = { v:'wave speed', f:'frequency', lambda:'wavelength' };
  var UNIT = { v:'m/s', f:'Hz', lambda:'m' };

  function colorOf(key){ return isDarkMode() ? CLR[key].dark : CLR[key].light; }

  var F_VALUES = [2,4,5,8,10,16,20,25,40,50];
  var L_VALUES = [0.5,1,1.5,2,2.5,4,5,8,10];

  var SCENARIOS_REAL = {
    v: [
      "A wave has a frequency of {f} Hz and a wavelength of {lambda} m. Find its speed.",
      "A sound wave has frequency {f} Hz and wavelength {lambda} m. What is its speed?",
      "A wave on a rope oscillates at {f} Hz with a wavelength of {lambda} m. Calculate its speed."
    ],
    f: [
      "A wave travels at {v} m/s and has a wavelength of {lambda} m. Find its frequency.",
      "A sound wave moves at {v} m/s with wavelength {lambda} m. What is its frequency?",
      "A wave on a string travels at {v} m/s, with a wavelength of {lambda} m. Calculate its frequency."
    ],
    lambda: [
      "A wave travels at {v} m/s with a frequency of {f} Hz. Find its wavelength.",
      "A sound wave moves at {v} m/s and has a frequency of {f} Hz. What is its wavelength?",
      "A wave on a rope travels at {v} m/s, oscillating at {f} Hz. Calculate its wavelength."
    ]
  };
  var SCENARIOS_DND = {
    v: [
      "A spell-wave from a wizard's staff has a frequency of {f} Hz and a wavelength of {lambda} m. Find its speed.",
      "An enchanted sound wave rippling through a cave has frequency {f} Hz and wavelength {lambda} m. What is its speed?",
      "A wave on a bard's magic harp string oscillates at {f} Hz with a wavelength of {lambda} m. Calculate its speed."
    ],
    f: [
      "A ripple across an enchanted lake travels at {v} m/s and has a wavelength of {lambda} m. Find its frequency.",
      "A wizard's sonic blast moves at {v} m/s with wavelength {lambda} m. What is its frequency?",
      "A wave on a troll's drum-skin travels at {v} m/s, with a wavelength of {lambda} m. Calculate its frequency."
    ],
    lambda: [
      "A ripple across an enchanted lake travels at {v} m/s with a frequency of {f} Hz. Find its wavelength.",
      "A wizard's sonic blast moves at {v} m/s and has a frequency of {f} Hz. What is its wavelength?",
      "A wave on a bard's magic harp string travels at {v} m/s, oscillating at {f} Hz. Calculate its wavelength."
    ]
  };
  var SCENARIOS = {
    v: SCENARIOS_REAL.v.concat(SCENARIOS_DND.v),
    f: SCENARIOS_REAL.f.concat(SCENARIOS_DND.f),
    lambda: SCENARIOS_REAL.lambda.concat(SCENARIOS_DND.lambda)
  };

  // canonical accepted rearrangements, already normalized (see normalizeFormula)
  var FORMULA_OK = {
    v: ['v=flambda','v=lambdaf'],
    f: ['f=v/lambda'],
    lambda: ['lambda=v/f']
  };
  var FORMULA_CHOICES = {
    v: ['v = f × λ', 'v = f ÷ λ', 'v = λ ÷ f'],
    f: ['f = v ÷ λ', 'f = v × λ', 'f = λ ÷ v'],
    lambda: ['λ = v ÷ f', 'λ = v × f', 'λ = f ÷ v']
  };
  var FORMULA_CORRECT_DISPLAY = { v:'v = f × λ', f:'f = v ÷ λ', lambda:'λ = v ÷ f' };
  // the base formula never changes shape, whichever variable is being solved for
  var FORMULA_ORIGINAL_OK = ['v=flambda','v=lambdaf'];
  // every formula NZQA prints on the real 91523 wave-systems reference sheet
  // (2022 Resource Booklet) -- in the actual exam a student sees all five at
  // once and has to pick the one that applies, so Learner mode mirrors that
  // exact choice instead of a made-up multi-choice.
  var FORMULA_SHEET_OPTIONS = [
    'v = f λ',
    'f = 1 / T',
    'd sinθ = n λ',
    'n λ = dx / L',
    "f ' = f × vW ÷ (vW ± vS)"
  ];

  // accepted ways to name/symbol/unit each quantity -- used by Confident's
  // "what is this?" box, Expert's find-it-yourself and known-facts boxes,
  // and the typed answer-unit box (all modes).
  var NAME_ALIASES = {
    v: ['wave speed', 'speed'],
    f: ['frequency'],
    lambda: ['wavelength', 'wave length']
  };
  var SYMBOL_ALIASES = {
    v: ['v'],
    f: ['f'],
    lambda: ['λ', 'lambda']
  };
  var UNIT_ALIASES = {
    v: ['m/s', 'm per s', 'metres per second', 'metre per second', 'meters per second', 'meter per second'],
    f: ['hz', 'hertz'],
    lambda: ['m', 'metre', 'metres', 'meter', 'meters']
  };

  function normalizeFormula(s){
    return (s||'').toString().trim().toLowerCase()
      .replace(/λ/g,'lambda')
      .replace(/[×✕✗\*]/g,'')
      .replace(/÷/g,'/')
      .replace(/\s+/g,'');
  }
  function identifyFieldOk(key, field, raw){
    var list = field === 'name' ? NAME_ALIASES[key] : (field === 'symbol' ? SYMBOL_ALIASES[key] : UNIT_ALIASES[key]);
    return list.map(normalizeGuess).indexOf(normalizeGuess(raw)) !== -1;
  }

  var FIELD_MODE = 'learner';
  var score = 0, asked = 0;
  var ROUND_SIZE = 6;
  var current = null; // {target, given:{}, correct, scenario}

  function newProblem(){
    var f = pick(F_VALUES);
    var lambda = pick(L_VALUES);
    var v = f * lambda;
    var target = pick(['v','f','lambda']);
    var scenario = pick(SCENARIOS[target])
      .replace('{f}', f).replace('{lambda}', lambda).replace('{v}', v.toFixed(2));
    var correct = target === 'v' ? v : (target === 'f' ? f : lambda);
    current = { target:target, f:f, lambda:lambda, v:v, correct:correct, scenario:scenario };
    renderProblem();
  }


  function renderProblem(){
    var card = document.getElementById('problemCard');
    var t = current.target;
    var givenKeys = ['v','f','lambda'].filter(function(k){ return k !== t; });

    // Learner: told exactly which value is which (labelled, colour-coded).
    // Confident/Expert: values aren't labelled or coloured any more -- the
    // whole point is the student has to work out which symbol each one is.
    var learnerFactsHtml = givenKeys.map(function(k){
      var val = k === 'v' ? current.v.toFixed(2) : current[k];
      return '<span class="fact-chip" style="color:'+colorOf(k)+';border-color:'+colorOf(k)+'">'
        + LABEL[k] + ' = ' + val + ' ' + UNIT[k] + '</span>';
    }).join('');

    // Confident: the values are shown, but the student must write down what
    // each one is before moving on -- not just hold it in their head. Name
    // and symbol get separate boxes (symbol needs the Greek helper for λ).
    var factGuessHtml = '';
    if(FIELD_MODE === 'confident'){
      factGuessHtml = '<div class="fact-guess-grid">' + givenKeys.map(function(k){
        var val = k === 'v' ? current.v.toFixed(2) : current[k];
        return '<div class="fact-guess">' +
          '<span class="fact-value-chip">' + val + ' ' + UNIT[k] + '</span>' +
          '<div class="id-grid id-grid-2">' +
            '<div class="id-field"><label>Name</label><input class="fact-guess-input" data-fact-key="'+k+'" data-fact-guess-field="name" autocomplete="off" spellcheck="false" placeholder="name"></div>' +
            '<div class="id-field"><label>Symbol</label>' + buildGreekInputHtml('class="fact-guess-input" data-fact-key="'+k+'" data-fact-guess-field="symbol"', 'symbol') + '</div>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>';
    }
    // Expert: no values shown at all -- everything must come from the scenario,
    // and even the target itself isn't given away (see targetIdHtml below).
    var factsRowHtml = '';
    if(FIELD_MODE !== 'expert'){
      var findHtml = '<span class="find-chip" style="color:'+colorOf(t)+';border-color:'+colorOf(t)+'">Find: '
        + LABEL[t] + ' (' + NAME[t] + ')</span>';
      factsRowHtml = '<div class="facts-row">' + (FIELD_MODE === 'learner' ? learnerFactsHtml : '') + findHtml + '</div>';
    }

    // Expert only: the student has to say what they're solving for, and
    // write down every known fact themselves (value included) -- nothing
    // is given for free, same as reading a real exam question cold.
    var targetIdHtml = '';
    var knownFactsHtml = '';
    if(FIELD_MODE === 'expert'){
      targetIdHtml =
        '<div class="id-block">' +
          '<p class="id-block-label">What are you trying to find?</p>' +
          '<div class="id-grid id-grid-3">' +
            '<div class="id-field"><label>Name</label><input class="target-id-input" data-target-field="name" autocomplete="off" spellcheck="false"></div>' +
            '<div class="id-field"><label>Symbol</label>' + buildGreekInputHtml('class="target-id-input" data-target-field="symbol"', '') + '</div>' +
            '<div class="id-field"><label>Unit</label><input class="target-id-input" data-target-field="unit" autocomplete="off" spellcheck="false"></div>' +
          '</div>' +
        '</div>';

      knownFactsHtml =
        '<div class="id-block">' +
          '<p class="id-block-label">What do you know? (write down every fact from the question)</p>' +
          givenKeys.map(function(k, idx){
            return '<div class="known-fact-block">' +
              '<p class="known-fact-heading">Fact ' + (idx+1) + '</p>' +
              '<div class="id-grid id-grid-4">' +
                '<div class="id-field"><label>Value</label><input class="known-fact-input" data-fact-key="'+k+'" data-fact-field="value" autocomplete="off" inputmode="decimal" placeholder="0.00"></div>' +
                '<div class="id-field"><label>Name</label><input class="known-fact-input" data-fact-key="'+k+'" data-fact-field="name" autocomplete="off" spellcheck="false"></div>' +
                '<div class="id-field"><label>Symbol</label>' + buildGreekInputHtml('class="known-fact-input" data-fact-key="'+k+'" data-fact-field="symbol"', '') + '</div>' +
                '<div class="id-field"><label>Unit</label><input class="known-fact-input" data-fact-key="'+k+'" data-fact-field="unit" autocomplete="off" spellcheck="false"></div>' +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>';
    }

    var origFormulaHtml = '';
    if(FIELD_MODE === 'learner'){
      var sheetOptHtml = '<option value="">— choose —</option>' + shuffle(FORMULA_SHEET_OPTIONS).map(function(o){
        return '<option value="'+o+'">'+o+'</option>';
      }).join('');
      origFormulaHtml =
        '<div class="field-row">' +
          '<label>Which formula from your sheet applies here?</label>' +
          '<select id="origFormulaInput">'+sheetOptHtml+'</select>' +
          '<p class="field-hint">These are the real formulae from the NCEA wave-systems reference sheet — in the exam you\'ll see all of them at once and have to pick the right one, same as here.</p>' +
        '</div>';
    } else if(FIELD_MODE === 'confident' || FIELD_MODE === 'expert'){
      origFormulaHtml =
        '<div class="field-row">' +
          '<label>Original formula (before rearranging)</label>' +
          buildFormulaInputHtml('origFormulaInput', '') +
          '<p class="field-hint">Write it exactly as you learned it, before you rearrange anything below.</p>' +
        '</div>';
    }

    var formulaFieldHtml = '';
    if(FIELD_MODE === 'learner'){
      var opts = FORMULA_CHOICES[t].slice();
      // shuffle
      for(var i=opts.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=opts[i]; opts[i]=opts[j]; opts[j]=tmp; }
      var optHtml = '<option value="">— choose —</option>' + opts.map(function(o){ return '<option value="'+o+'">'+o+'</option>'; }).join('');
      formulaFieldHtml =
        '<div class="field-row">' +
          '<label>Rearranged formula</label>' +
          '<select id="formulaInput">'+optHtml+'</select>' +
        '</div>';
    } else if(FIELD_MODE === 'confident'){
      formulaFieldHtml =
        '<div class="field-row">' +
          '<label>Rearranged formula (write it before you substitute &mdash; or type &quot;same&quot; if it is already in the right order)</label>' +
          buildFormulaInputHtml('formulaInput', 'e.g. '+FORMULA_CORRECT_DISPLAY[t]) +
          '<p class="field-hint">Use × or * for multiply, ÷ or / for divide, lambda or λ for wavelength.</p>' +
        '</div>';
    } else if(FIELD_MODE === 'expert'){
      formulaFieldHtml =
        '<div class="field-row">' +
          '<label>Rearranged formula (write it before you substitute &mdash; or type &quot;same&quot; if it is already in the right order)</label>' +
          buildFormulaInputHtml('formulaInput', '') +
          '<p class="field-hint">Use × or * for multiply, ÷ or / for divide, lambda or λ for wavelength.</p>' +
        '</div>';
    }

    card.innerHTML =
      '<p class="problem-text">' + current.scenario + '</p>' +
      factsRowHtml +
      targetIdHtml +
      knownFactsHtml +
      factGuessHtml +
      origFormulaHtml +
      formulaFieldHtml +
      '<div class="field-row">' +
        '<label>Working (optional — show your substitution)</label>' +
        '<input id="workingInput" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. 5 / 12">' +
      '</div>' +
      '<div class="field-row">' +
        '<label>Your answer</label>' +
        '<div class="answer-row">' +
          '<input id="answerInput" class="answer-value-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">' +
          '<input id="answerUnitInput" class="answer-unit-input" type="text" autocomplete="off" spellcheck="false" placeholder="unit">' +
          buildCalculatorHtml() +
        '</div>' +
      '</div>' +
      '<div class="actions-row">' +
        '<button class="check-btn" id="checkBtn" type="button">Check</button>' +
        '<span class="feedback" id="feedback" aria-live="polite"></span>' +
      '</div>';

    document.getElementById('checkBtn').addEventListener('click', checkAnswer);
    var answerInput = document.getElementById('answerInput');
    answerInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); checkAnswer(); } });
    var answerUnitInput = document.getElementById('answerUnitInput');
    answerUnitInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); checkAnswer(); } });
    var origFormulaInput = document.getElementById('origFormulaInput');
    if(origFormulaInput){
      origFormulaInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); checkAnswer(); } });
    }
    var formulaInput = document.getElementById('formulaInput');
    if(formulaInput){
      formulaInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); checkAnswer(); } });
    }
    var workingInput = document.getElementById('workingInput');
    workingInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); checkAnswer(); } });
    wireGreekPopups(card);
    wireCalculator(card);

    var focusEl = card.querySelector('.target-id-input') || card.querySelector('.fact-guess-input') || origFormulaInput || formulaInput || answerInput;
    focusEl.focus();
  }

  function checkAnswer(){
    var t = current.target;
    var card = document.getElementById('problemCard');
    var origFormulaEl = document.getElementById('origFormulaInput');
    var formulaEl = document.getElementById('formulaInput');
    var answerEl = document.getElementById('answerInput');
    var answerUnitEl = document.getElementById('answerUnitInput');
    var feedback = document.getElementById('feedback');
    var checkBtn = document.getElementById('checkBtn');

    var allOk = true;
    var message = '';

    var factGuessEls = card.querySelectorAll('.fact-guess-input');
    if(factGuessEls.length){
      var factsOk = true;
      factGuessEls.forEach(function(el){
        var k = el.getAttribute('data-fact-key');
        var field = el.getAttribute('data-fact-guess-field');
        var ok = identifyFieldOk(k, field, el.value);
        el.classList.remove('ok','bad');
        el.classList.add(ok ? 'ok' : 'bad');
        if(!ok) factsOk = false;
      });
      if(!factsOk){ allOk = false; message = message || 'Check which value is which fact — one or more isn\'t right yet.'; }
    }

    var targetIdEls = card.querySelectorAll('.target-id-input');
    if(targetIdEls.length){
      var targetIdOk = true;
      targetIdEls.forEach(function(el){
        var field = el.getAttribute('data-target-field');
        var ok = identifyFieldOk(t, field, el.value);
        el.classList.remove('ok','bad');
        el.classList.add(ok ? 'ok' : 'bad');
        if(!ok) targetIdOk = false;
      });
      if(!targetIdOk){ allOk = false; message = message || 'Check the name, symbol and unit of what you\'re finding.'; }
    }

    var knownFactEls = card.querySelectorAll('.known-fact-input');
    if(knownFactEls.length){
      var knownFactsOk = true;
      knownFactEls.forEach(function(el){
        var k = el.getAttribute('data-fact-key');
        var field = el.getAttribute('data-fact-field');
        var ok;
        if(field === 'value'){
          var correctVal = k === 'v' ? parseFloat(current.v.toFixed(2)) : current[k];
          var typedVal = normalizeNumber(el.value);
          ok = !isNaN(typedVal) && Math.abs(typedVal - correctVal) <= Math.max(0.02*Math.abs(correctVal), 0.03);
        } else {
          ok = identifyFieldOk(k, field, el.value);
        }
        el.classList.remove('ok','bad');
        el.classList.add(ok ? 'ok' : 'bad');
        if(!ok) knownFactsOk = false;
      });
      if(!knownFactsOk){ allOk = false; message = message || 'One of your known facts (value, name, symbol or unit) isn\'t right yet.'; }
    }

    if(origFormulaEl){
      var origOk = FORMULA_ORIGINAL_OK.indexOf(normalizeFormula(origFormulaEl.value)) !== -1;
      origFormulaEl.classList.remove('ok','bad');
      origFormulaEl.classList.add(origOk ? 'ok' : 'bad');
      if(!origOk){ allOk = false; message = message || 'That\'s not the formula that applies here — check your sheet again.'; }
    }

    if(formulaEl){
      var formulaRaw = formulaEl.value.trim().toLowerCase() === 'same' ? origFormulaEl.value : formulaEl.value;
      var formulaOk = FORMULA_OK[t].indexOf(normalizeFormula(formulaRaw)) !== -1;
      formulaEl.classList.remove('ok','bad');
      formulaEl.classList.add(formulaOk ? 'ok' : 'bad');
      if(!formulaOk){ allOk = false; message = message || 'The rearranged formula isn\'t quite right yet — try again.'; }
    }

    var typed = normalizeNumber(answerEl.value);
    var answerOk = !isNaN(typed) && Math.abs(typed - current.correct) <= Math.max(0.02*Math.abs(current.correct), 0.03);
    answerEl.classList.remove('ok','bad');
    answerEl.classList.add(answerOk ? 'ok' : 'bad');
    if(!answerOk){ allOk = false; message = message || 'Not quite — check your substitution and try again.'; }

    var unitOk = identifyFieldOk(t, 'unit', answerUnitEl.value);
    answerUnitEl.classList.remove('ok','bad');
    answerUnitEl.classList.add(unitOk ? 'ok' : 'bad');
    if(!unitOk){ allOk = false; message = message || 'Don\'t forget to write the unit — check it matches your answer.'; }

    asked++;
    if(allOk){
      score++;
      updateScore();
      checkBtn.disabled = true;
      var correctModal = document.getElementById('correctModal');
      correctModal.hidden = false;
      setTimeout(function(){
        correctModal.hidden = true;
        if(asked >= ROUND_SIZE){ showRoundDone(); } else { newProblem(); }
      }, 1000);
    } else {
      feedback.textContent = message;
      asked--; // allow retry on the same problem
    }
  }

  function updateScore(){
    document.getElementById('scoreBadge').innerHTML = '<b>'+score+'</b> / '+ROUND_SIZE+' correct this round';
  }

  function showRoundDone(){
    var modal = document.getElementById('roundDoneModal');
    var title = document.getElementById('roundDoneTitle');
    var summary = document.getElementById('roundDoneSummary');
    var btn = document.getElementById('roundDoneBtn');
    if(score === ROUND_SIZE){
      title.textContent = "Perfect round!";
      summary.textContent = "All " + ROUND_SIZE + " correct — you've got v = fλ solid in this mode.";
    } else {
      title.textContent = "Round complete";
      summary.textContent = score + " out of " + ROUND_SIZE + " correct. Have another go to lock it in.";
    }
    btn.onclick = function(){ modal.hidden = true; startRound(); };
    modal.hidden = false;
    btn.focus();
  }

  function startRound(){
    score = 0; asked = 0;
    updateScore();
    newProblem();
  }

  document.getElementById('newRoundBtn').addEventListener('click', startRound);

  var modeButtons = panel.querySelectorAll('.mode-btn');
  function updateModeButtons(){
    modeButtons.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-mode') === FIELD_MODE); });
  }
  modeButtons.forEach(function(b){
    b.addEventListener('click', function(){

      if(m === FIELD_MODE) return;
      FIELD_MODE = m;
      updateModeButtons();
      startRound();
    });
  });
  updateModeButtons();

  window.formulaLabTopics = window.formulaLabTopics || [];
  window.formulaLabTopics.push(startRound);

  startRound();
})();
</script>

  function normalizeFormula(s){

    var formulaOk = FORMULA_OK.indexOf(normalizeFormula(formulaRaw)) !== -1;

(function(){

  var UNIT = { fs:'Hz', fo:'Hz', vs:'m/s', v:'m/s' };

  function colorOf(key){ return isDarkMode() ? CLR[key].dark : CLR[key].light; }

  var FS_VALUES = [400,440,500,550,600,650,700,750,800];
  var VS_VALUES = [5,10,15,20,25,30];
  var V_VALUES = [330,340,350];

  // real NCEA-style Doppler questions are source-moving only (per
  // teachernotes.txt -- observer-moving is Merit/Excellence content,
  // deliberately skipped), and always state the direction explicitly.
  var SCENARIOS_REAL = {
    toward: [
      "A police car's siren emits a true frequency of {fs} Hz. As the car races towards a stationary bystander at {vs} m/s (speed of sound {v} m/s), what frequency does the bystander hear?",
      "A train's whistle sounds at {fs} Hz. As the train approaches a platform at {vs} m/s, with sound travelling at {v} m/s, what frequency do waiting passengers hear?",
      "An ambulance's siren emits {fs} Hz. As it drives towards a parked car at {vs} m/s, with sound travelling at {v} m/s, what frequency does the driver hear?"
    ],
    away: [
      "A police car's siren emits a true frequency of {fs} Hz. As the car speeds away from a stationary bystander at {vs} m/s (speed of sound {v} m/s), what frequency does the bystander hear?",
      "A train's whistle sounds at {fs} Hz. As the train pulls away from a platform at {vs} m/s, with sound travelling at {v} m/s, what frequency do the passengers left behind hear?",
      "An ambulance's siren emits {fs} Hz. As it drives away from a parked car at {vs} m/s, with sound travelling at {v} m/s, what frequency does the driver hear?"
    ]
  };
  var SCENARIOS_DND = {
    toward: [
      "A war-horn emits a true frequency of {fs} Hz. As the herald charges towards a waiting scout at {vs} m/s (speed of sound {v} m/s), what frequency does the scout hear?",
      "A dragon's roar sounds at {fs} Hz. As the dragon swoops towards a village at {vs} m/s, with sound travelling at {v} m/s, what frequency do the villagers hear?",
      "An enchanted courier's bell emits {fs} Hz. As it rides towards a waiting wizard at {vs} m/s, with sound travelling at {v} m/s, what frequency does the wizard hear?"
    ],
    away: [
      "A war-horn emits a true frequency of {fs} Hz. As the herald retreats away from a waiting scout at {vs} m/s (speed of sound {v} m/s), what frequency does the scout hear?",
      "A dragon's roar sounds at {fs} Hz. As the dragon flies away from a village at {vs} m/s, with sound travelling at {v} m/s, what frequency do the villagers hear?",
      "An enchanted courier's bell emits {fs} Hz. As it rides away from a waiting wizard at {vs} m/s, with sound travelling at {v} m/s, what frequency does the wizard hear?"
    ]
  };
  var SCENARIOS = {
    toward: SCENARIOS_REAL.toward.concat(SCENARIOS_DND.toward),
    away: SCENARIOS_REAL.away.concat(SCENARIOS_DND.away)
  };

  var NAME_ALIASES = {
    fs: ['source frequency', 'true frequency', 'actual frequency', 'emitted frequency'],
    fo: ['observed frequency', 'heard frequency', 'apparent frequency', 'detected frequency'],
    vs: ['source speed', 'speed of source'],
    v: ['speed of sound', 'sound speed']
  };
  var SYMBOL_ALIASES = {
    fs: ['f', 'fs'],
    fo: ['f\'', 'fo', 'fprime'],
    vs: ['vs', 'vS'],
    v: ['vw', 'v']
  };
  var UNIT_ALIASES = {
    fs: ['hz', 'hertz'],
    fo: ['hz', 'hertz'],
    vs: ['m/s', 'm per s', 'metres per second', 'metre per second', 'meters per second', 'meter per second'],
    v: ['m/s', 'm per s', 'metres per second', 'metre per second', 'meters per second', 'meter per second']
  };
  function identifyFieldOk(key, field, raw){
    var list = field === 'name' ? NAME_ALIASES[key] : (field === 'symbol' ? SYMBOL_ALIASES[key] : UNIT_ALIASES[key]);
    return list.map(normalizeGuess).indexOf(normalizeGuess(raw)) !== -1;
  }
  function normalizeFormula(s){
    return (s||'').toString().trim().toLowerCase()
      .replace(/−/g,'-')
      .replace(/[×✕✗\*]/g,'')
      .replace(/÷/g,'/')
      .replace(/\s+/g,'');
  }

  // uses exactly what's printed on the real 91523 sheet (f'/f/vW/vS),
  // matching this tab's own labels now -- +-/-+ is accepted as a
  // typeable stand-in for the ± this formula can't avoid (same
  // shorthand teachernotes.txt itself uses: "fo = fs.v/(v -+ vs)").
  var PM_VARIANTS = ['±', '+-', '-+'];
  var FORMULA_ORIGINAL_OK = PM_VARIANTS.map(function(pm){ return "f'=fvw/(vw"+pm+"vs)"; });
  var FORMULA_SHEET_OPTIONS = [
    'v = f λ',
    'f = 1 / T',
    'd sinθ = n λ',
    'n λ = dx / L',
    "f ' = f × vW ÷ (vW ± vS)"
  ];

  function formulaOkList(direction){
    var sign = direction === 'toward' ? '-' : '+';
    return ["f'=fvw/(vw"+sign+"vs)", "f'=vwf/(vw"+sign+"vs)"];
  }
  function formulaDisplay(direction){
    return direction === 'toward' ? "f ' = f × vW ÷ (vW - vS)" : "f ' = f × vW ÷ (vW + vS)";
  }
  function formulaChoices(direction){
    var correct = formulaDisplay(direction);
    var wrongOtherDirection = direction === 'toward' ? "f ' = f × vW ÷ (vW + vS)" : "f ' = f × vW ÷ (vW - vS)";
    var wrongStructure = "f ' = f × (vW ÷ vS)";
    return [correct, wrongOtherDirection, wrongStructure];
  }

  var FIELD_MODE = 'learner';
  var score = 0, asked = 0;
  var ROUND_SIZE = 6;
  var current = null;

  function newProblem(){
    var fs = pick(FS_VALUES);
    var vs = pick(VS_VALUES);
    var v = pick(V_VALUES);
    var direction = Math.random() < 0.5 ? 'toward' : 'away';
    var denom = direction === 'toward' ? (v - vs) : (v + vs);
    var fo = fs * v / denom;
    var scenario = pick(SCENARIOS[direction])
      .replace('{fs}', fs).replace('{vs}', vs).replace('{v}', v);
    current = { fs:fs, vs:vs, v:v, direction:direction, correct:fo, scenario:scenario };
    renderProblem();
  }

  function renderProblem(){
    var card = document.getElementById('problemCard-dop');
    var givenKeys = ['fs','vs','v'];

    var learnerFactsHtml = givenKeys.map(function(k){
      return '<span class="fact-chip" style="color:'+colorOf(k)+';border-color:'+colorOf(k)+'">'
        + LABEL[k] + ' = ' + current[k] + ' ' + UNIT[k] + '</span>';
    }).join('');

    var factGuessHtml = '';
    if(FIELD_MODE === 'confident'){
      factGuessHtml = '<div class="fact-guess-grid">' + givenKeys.map(function(k){
        return '<div class="fact-guess">' +
          '<span class="fact-value-chip">' + current[k] + ' ' + UNIT[k] + '</span>' +
          '<div class="id-grid id-grid-2">' +
            '<div class="id-field"><label>Name</label><input class="fact-guess-input" data-fact-key="'+k+'" data-fact-guess-field="name" autocomplete="off" spellcheck="false" placeholder="name"></div>' +
            '<div class="id-field"><label>Symbol</label>' + buildGreekInputHtml('class="fact-guess-input" data-fact-key="'+k+'" data-fact-guess-field="symbol"', 'symbol') + '</div>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>';
    }

    var factsRowHtml = '';
    if(FIELD_MODE !== 'expert'){
      var findHtml = '<span class="find-chip" style="color:'+colorOf('fo')+';border-color:'+colorOf('fo')+'">Find: '
        + LABEL.fo + ' (' + NAME.fo + ')</span>';
      factsRowHtml = '<div class="facts-row">' + (FIELD_MODE === 'learner' ? learnerFactsHtml : '') + findHtml + '</div>';
    }

    var targetIdHtml = '';
    var knownFactsHtml = '';
    if(FIELD_MODE === 'expert'){
      targetIdHtml =
        '<div class="id-block">' +
          '<p class="id-block-label">What are you trying to find?</p>' +
          '<div class="id-grid id-grid-3">' +
            '<div class="id-field"><label>Name</label><input class="target-id-input" data-target-field="name" autocomplete="off" spellcheck="false"></div>' +
            '<div class="id-field"><label>Symbol</label>' + buildGreekInputHtml('class="target-id-input" data-target-field="symbol"', '') + '</div>' +
            '<div class="id-field"><label>Unit</label><input class="target-id-input" data-target-field="unit" autocomplete="off" spellcheck="false"></div>' +
          '</div>' +
        '</div>';
      knownFactsHtml =
        '<div class="id-block">' +
          '<p class="id-block-label">What do you know? (write down every fact from the question)</p>' +
          givenKeys.map(function(k, idx){
            return '<div class="known-fact-block">' +
              '<p class="known-fact-heading">Fact ' + (idx+1) + '</p>' +
              '<div class="id-grid id-grid-4">' +
                '<div class="id-field"><label>Value</label><input class="known-fact-input" data-fact-key="'+k+'" data-fact-field="value" autocomplete="off" inputmode="decimal" placeholder="0.00"></div>' +
                '<div class="id-field"><label>Name</label><input class="known-fact-input" data-fact-key="'+k+'" data-fact-field="name" autocomplete="off" spellcheck="false"></div>' +
                '<div class="id-field"><label>Symbol</label>' + buildGreekInputHtml('class="known-fact-input" data-fact-key="'+k+'" data-fact-field="symbol"', '') + '</div>' +
                '<div class="id-field"><label>Unit</label><input class="known-fact-input" data-fact-key="'+k+'" data-fact-field="unit" autocomplete="off" spellcheck="false"></div>' +
              '</div>' +
            '</div>';
          }).join('') +
        '</div>';
    }

    var origFormulaHtml = '';
    if(FIELD_MODE === 'learner'){
      var sheetOptHtml = '<option value="">— choose —</option>' + shuffle(FORMULA_SHEET_OPTIONS).map(function(o){
        return '<option value="'+o+'">'+o+'</option>';
      }).join('');
      origFormulaHtml =
        '<div class="field-row">' +
          '<label>Which formula from your sheet applies here?</label>' +
          '<select id="origFormulaInput-dop">'+sheetOptHtml+'</select>' +
          '<p class="field-hint">These are the real formulae from the NCEA wave-systems reference sheet — in the exam you\'ll see all of them at once and have to pick the right one, same as here.</p>' +
        '</div>';
    } else {
      origFormulaHtml =
        '<div class="field-row">' +
          '<label>Original formula (before rearranging)</label>' +
          buildFormulaInputHtml('origFormulaInput-dop', '') +
          '<p class="field-hint">Write it exactly as printed on your formula sheet — you can type +- or -+ for the ± sign.</p>' +
        '</div>';
    }

    var formulaFieldHtml = '';
    if(FIELD_MODE === 'learner'){
      var opts = shuffle(formulaChoices(current.direction));
      var optHtml = '<option value="">— choose —</option>' + opts.map(function(o){ return '<option value="'+o+'">'+o+'</option>'; }).join('');
      formulaFieldHtml =
        '<div class="field-row">' +
          '<label>Rearranged formula</label>' +
          '<select id="formulaInput-dop">'+optHtml+'</select>' +
        '</div>';
    } else {
      formulaFieldHtml =
        '<div class="field-row">' +
          '<label>Rearranged formula (write it before you substitute &mdash; or type &quot;same&quot; if it is already in the right order)</label>' +
          buildFormulaInputHtml('formulaInput-dop', FIELD_MODE === 'confident' ? 'e.g. '+formulaDisplay(current.direction) : '') +
          '<p class="field-hint">Use × or * for multiply, ÷ or / for divide.</p>' +
        '</div>';
    }

    card.innerHTML =
      '<p class="problem-text">' + current.scenario + '</p>' +
      factsRowHtml +
      targetIdHtml +
      knownFactsHtml +
      factGuessHtml +
      origFormulaHtml +
      formulaFieldHtml +
      '<div class="field-row">' +
        '<label>Working (optional — show your substitution)</label>' +
        '<input id="workingInput-dop" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. 5 / 12">' +
      '</div>' +
      '<div class="field-row">' +
        '<label>Your answer</label>' +
        '<div class="answer-row">' +
          '<input id="answerInput-dop" class="answer-value-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00">' +
          '<input id="answerUnitInput-dop" class="answer-unit-input" type="text" autocomplete="off" spellcheck="false" placeholder="unit">' +
          buildCalculatorHtml() +
        '</div>' +
      '</div>' +
      '<div class="actions-row">' +
        '<button class="check-btn" id="checkBtn-dop" type="button">Check</button>' +
        '<span class="feedback" id="feedback-dop" aria-live="polite"></span>' +
      '</div>';

    document.getElementById('checkBtn-dop').addEventListener('click', checkAnswer);
    var answerInput = document.getElementById('answerInput-dop');
    answerInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); checkAnswer(); } });
    var answerUnitInput = document.getElementById('answerUnitInput-dop');
    answerUnitInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); checkAnswer(); } });
    var origFormulaInput = document.getElementById('origFormulaInput-dop');
    origFormulaInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); checkAnswer(); } });
    var formulaInput = document.getElementById('formulaInput-dop');
    formulaInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); checkAnswer(); } });
    var workingInput = document.getElementById('workingInput-dop');
    workingInput.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); checkAnswer(); } });
    wireGreekPopups(card);
    wireCalculator(card);

    var focusEl = card.querySelector('.target-id-input') || card.querySelector('.fact-guess-input') || origFormulaInput || formulaInput || answerInput;
    focusEl.focus();
  }

  function checkAnswer(){
    var card = document.getElementById('problemCard-dop');
    var origFormulaEl = document.getElementById('origFormulaInput-dop');
    var formulaEl = document.getElementById('formulaInput-dop');
    var answerEl = document.getElementById('answerInput-dop');
    var answerUnitEl = document.getElementById('answerUnitInput-dop');
    var feedback = document.getElementById('feedback-dop');
    var checkBtn = document.getElementById('checkBtn-dop');

    var allOk = true;
    var message = '';

    var factGuessEls = card.querySelectorAll('.fact-guess-input');
    if(factGuessEls.length){
      var factsOk = true;
      factGuessEls.forEach(function(el){
        var k = el.getAttribute('data-fact-key');
        var field = el.getAttribute('data-fact-guess-field');
        var ok = identifyFieldOk(k, field, el.value);
        el.classList.remove('ok','bad');
        el.classList.add(ok ? 'ok' : 'bad');
        if(!ok) factsOk = false;
      });
      if(!factsOk){ allOk = false; message = message || 'Check which value is which fact — one or more isn\'t right yet.'; }
    }

    var targetIdEls = card.querySelectorAll('.target-id-input');
    if(targetIdEls.length){
      var targetIdOk = true;
      targetIdEls.forEach(function(el){
        var field = el.getAttribute('data-target-field');
        var ok = identifyFieldOk('fo', field, el.value);
        el.classList.remove('ok','bad');
        el.classList.add(ok ? 'ok' : 'bad');
        if(!ok) targetIdOk = false;
      });
      if(!targetIdOk){ allOk = false; message = message || 'Check the name, symbol and unit of what you\'re finding.'; }
    }

    var knownFactEls = card.querySelectorAll('.known-fact-input');
    if(knownFactEls.length){
      var knownFactsOk = true;
      knownFactEls.forEach(function(el){
        var k = el.getAttribute('data-fact-key');
        var field = el.getAttribute('data-fact-field');
        var ok;
        if(field === 'value'){
          var correctVal = current[k];
          var typedVal = normalizeNumber(el.value);
          ok = !isNaN(typedVal) && Math.abs(typedVal - correctVal) <= Math.max(0.02*Math.abs(correctVal), 0.03);
        } else {
          ok = identifyFieldOk(k, field, el.value);
        }
        el.classList.remove('ok','bad');
        el.classList.add(ok ? 'ok' : 'bad');
        if(!ok) knownFactsOk = false;
      });
      if(!knownFactsOk){ allOk = false; message = message || 'One of your known facts (value, name, symbol or unit) isn\'t right yet.'; }
    }

    var origOk = FORMULA_ORIGINAL_OK.indexOf(normalizeFormula(origFormulaEl.value)) !== -1;
    origFormulaEl.classList.remove('ok','bad');
    origFormulaEl.classList.add(origOk ? 'ok' : 'bad');
    if(!origOk){ allOk = false; message = message || 'That\'s not the formula that applies here — check your sheet again.'; }

    var formulaRaw = formulaEl.value.trim().toLowerCase() === 'same' ? origFormulaEl.value : formulaEl.value;
    var formulaOk = formulaOkList(current.direction).indexOf(normalizeFormula(formulaRaw)) !== -1;
    formulaEl.classList.remove('ok','bad');
    formulaEl.classList.add(formulaOk ? 'ok' : 'bad');
    if(!formulaOk){ allOk = false; message = message || 'The rearranged formula isn\'t quite right yet — check which direction the source is moving.'; }

    var typed = normalizeNumber(answerEl.value);
    var answerOk = !isNaN(typed) && Math.abs(typed - current.correct) <= Math.max(0.02*Math.abs(current.correct), 0.03);
    answerEl.classList.remove('ok','bad');
    answerEl.classList.add(answerOk ? 'ok' : 'bad');
    if(!answerOk){ allOk = false; message = message || 'Not quite — check your substitution and try again.'; }

    var unitOk = identifyFieldOk('fo', 'unit', answerUnitEl.value);
    answerUnitEl.classList.remove('ok','bad');
    answerUnitEl.classList.add(unitOk ? 'ok' : 'bad');
    if(!unitOk){ allOk = false; message = message || 'Don\'t forget to write the unit — check it matches your answer.'; }

    asked++;
    if(allOk){
      score++;
      updateScore();
      checkBtn.disabled = true;
      var correctModal = document.getElementById('correctModal');
      correctModal.hidden = false;
      setTimeout(function(){
        correctModal.hidden = true;
        if(asked >= ROUND_SIZE){ showRoundDone(); } else { newProblem(); }
      }, 1000);
    } else {
      feedback.textContent = message;
      asked--;
    }
  }

  function updateScore(){
    document.getElementById('scoreBadge-dop').innerHTML = '<b>'+score+'</b> / '+ROUND_SIZE+' correct this round';
  }

  function showRoundDone(){
    var modal = document.getElementById('roundDoneModal');
    var title = document.getElementById('roundDoneTitle');
    var summary = document.getElementById('roundDoneSummary');
    var btn = document.getElementById('roundDoneBtn');
    if(score === ROUND_SIZE){
      title.textContent = "Perfect round!";
      summary.textContent = "All " + ROUND_SIZE + " correct — you've got the Doppler effect solid in this mode.";
    } else {
      title.textContent = "Round complete";
      summary.textContent = score + " out of " + ROUND_SIZE + " correct. Have another go to lock it in.";
    }
    btn.onclick = function(){ modal.hidden = true; startRound(); };
    modal.hidden = false;
    btn.focus();
  }

  function startRound(){
    score = 0; asked = 0;
    updateScore();
    newProblem();
  }

  document.getElementById('newRoundBtn-dop').addEventListener('click', startRound);

  var panel = document.querySelector('.topic-panel[data-topic="doppler"]');
  var modeButtons = panel.querySelectorAll('.mode-btn');
  function updateModeButtons(){
    modeButtons.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-mode') === FIELD_MODE); });
  }
  modeButtons.forEach(function(b){
    b.addEventListener('click', function(){
      var m = b.getAttribute('data-mode');
      if(m === FIELD_MODE) return;
      FIELD_MODE = m;
      updateModeButtons();
      startRound();
    });
  });
  updateModeButtons();

  window.formulaLabTopics = window.formulaLabTopics || [];
  window.formulaLabTopics.push(startRound);

  startRound();
})();
</script>

<script>
(function(){
  "use strict";

  // colours match wave-lab.html's Standing Waves tab (L, n) and Basic
  // Wave (lambda -- same physical quantity, same colour), per colorkey.txt
  var CLR = {
    L:{light:'#1B8A82',dark:'#4FC9BE'}, n:{light:'#B23A72',dark:'#E87AAE'},
    lambda:{light:'#2569B0',dark:'#6FB1F2'}
  };
  var LABEL = { L:'L', n:'n', lambda:'λ' };
  var NAME = { L:'length', n:'harmonic number', lambda:'wavelength' };
  var UNIT = { L:'m', n:'—', lambda:'m' };
  var ORDINALS = { 1:'1st', 2:'2nd', 3:'3rd', 4:'4th', 5:'5th' };

  function colorOf(key){ return isDarkMode() ? CLR[key].dark : CLR[key].light; }

  var L_VALUES = [0.3,0.4,0.5,0.6,0.8,1.0,1.2,1.5,2.0];
  var N_VALUES = [1,2,3,4,5];

  // open pipe/string: every harmonic (n = 1,2,3...) is allowed
  var SCENARIOS_REAL = [
    "A flute, open at both ends, has an air column {L} m long, resonating in its {nOrd} harmonic. Find the wavelength of the sound produced.",
    "An open organ pipe {L} m long resonates in its {nOrd} harmonic. What is the wavelength of the standing wave inside it?",
    "A guitar string {L} m long vibrates in its {nOrd} harmonic. Find the wavelength of the wave on the string.",
    "A recorder, modelled as an open pipe {L} m long, sounds its {nOrd} harmonic. Calculate the wavelength involved.",
    "An open-ended tube {L} m long is set up to resonate in its {nOrd} harmonic. Find the wavelength of the standing wave."
  ];
  var SCENARIOS_DND = [
    "An enchanted flute, open at both ends, has an air column {L} m long, resonating in its {nOrd} harmonic. Find the wavelength of the sound produced.",
    "An open rune-pipe organ in a wizard's tower {L} m long resonates in its {nOrd} harmonic. What is the wavelength of the standing wave inside it?",
    "A bard's magic harp string {L} m long vibrates in its {nOrd} harmonic. Find the wavelength of the wave on the string.",
    "A goblin's whistle, modelled as an open pipe {L} m long, sounds its {nOrd} harmonic. Calculate the wavelength involved.",
    "An open-ended horn from a giant's hoard, {L} m long, is set up to resonate in its {nOrd} harmonic. Find the wavelength of the standing wave."
  ];
  var SCENARIOS = SCENARIOS_REAL.concat(SCENARIOS_DND);

  var NAME_ALIASES = {
    L: ['length', 'string length', 'tube length', 'length of string', 'length of tube', 'pipe length'],
    n: ['harmonic number', 'harmonic', 'mode number'],
    lambda: ['wavelength', 'wave length']
  };
  var SYMBOL_ALIASES = {
    L: ['l'],
    n: ['n'],
    lambda: ['λ', 'lambda']
  };
  var UNIT_ALIASES = {
    L: ['m', 'metre', 'metres', 'meter', 'meters'],
    n: ['none', 'no unit', 'unitless', 'dimensionless', '-', 'nounit'],
    lambda: ['m', 'metre', 'metres', 'meter', 'meters']
  };
  function identifyFieldOk(key, field, raw){
    var list = field === 'name' ? NAME_ALIASES[key] : (field === 'symbol' ? SYMBOL_ALIASES[key] : UNIT_ALIASES[key]);
    return list.map(normalizeGuess).indexOf(normalizeGuess(raw)) !== -1;
  }
  function normalizeFormula(s){
    return (s||'').toString().trim().toLowerCase()
      .replace(/λ/g,'lambda')
      .replace(/[×✕✗\*]/g,'')
      .replace(/÷/g,'/')
      .replace(/\s+/g,'');
  }
  // not on the real formula sheet (see memory/formula_sheet_gap.md) --
  // has to come from memory in every mode, including Learner.
  var FORMULA_OK = ['lambda=2l/n', 'lambda=(2l)/n'];
  var FORMULA_CORRECT_DISPLAY = 'λ = 2L ÷ n';

  var FIELD_MODE = 'learner';
  var score = 0, asked = 0;
  var ROUND_SIZE = 6;
  var current = null;

  function newProblem(){
    var L = pick(L_VALUES);
    var n = pick(N_VALUES);
    var lambda = 2 * L / n;
    var scenario = pick(SCENARIOS).replace('{L}', L).replace('{nOrd}', ORDINALS[n]);
    current = { L:L, n:n, correct:lambda, scenario:scenario };
    renderProblem();
  }

  function renderProblem(){
    var card = document.getElementById('problemCard-sopen');
    var givenKeys = ['L','n'];

    var learnerFactsHtml = givenKeys.map(function(k){

  function checkAnswer(){
    var card = document.getElementById('problemCard-sopen');
    var origFormulaEl = document.getElementById('origFormulaInput-sopen');
    var formulaEl = document.getElementById('formulaInput-sopen');
    var answerEl = document.getElementById('answerInput-sopen');
    var answerUnitEl = document.getElementById('answerUnitInput-sopen');
    var feedback = document.getElementById('feedback-sopen');
    var checkBtn = document.getElementById('checkBtn-sopen');

    var allOk = true;
    var message = '';

    var factGuessEls = card.querySelectorAll('.fact-guess-input');
    if(factGuessEls.length){
      var factsOk = true;
      factGuessEls.forEach(function(el){
        var k = el.getAttribute('data-fact-key');
        var field = el.getAttribute('data-fact-guess-field');
        var ok = identifyFieldOk(k, field, el.value);
        el.classList.remove('ok','bad');
        el.classList.add(ok ? 'ok' : 'bad');
        if(!ok) factsOk = false;
      });
      if(!factsOk){ allOk = false; message = message || 'Check which value is which fact — one or more isn\'t right yet.'; }
    }

    var targetIdEls = card.querySelectorAll('.target-id-input');
    if(targetIdEls.length){
      var targetIdOk = true;
      targetIdEls.forEach(function(el){
        var field = el.getAttribute('data-target-field');
        var ok = identifyFieldOk('lambda', field, el.value);
        el.classList.remove('ok','bad');
        el.classList.add(ok ? 'ok' : 'bad');
        if(!ok) targetIdOk = false;
      });
      if(!targetIdOk){ allOk = false; message = message || 'Check the name, symbol and unit of what you\'re finding.'; }
    }

    var knownFactEls = card.querySelectorAll('.known-fact-input');
    if(knownFactEls.length){
      var knownFactsOk = true;
      knownFactEls.forEach(function(el){
        var k = el.getAttribute('data-fact-key');
        var field = el.getAttribute('data-fact-field');
        var ok;
        if(field === 'value'){
          var correctVal = current[k];
          var typedVal = normalizeNumber(el.value);
          ok = !isNaN(typedVal) && Math.abs(typedVal - correctVal) <= Math.max(0.02*Math.abs(correctVal), 0.03);
        } else {
          ok = identifyFieldOk(k, field, el.value);
        }
        el.classList.remove('ok','bad');
        el.classList.add(ok ? 'ok' : 'bad');
        if(!ok) knownFactsOk = false;
      });
      if(!knownFactsOk){ allOk = false; message = message || 'One of your known facts (value, name, symbol or unit) isn\'t right yet.'; }
    }

    var origOk = FORMULA_OK.indexOf(normalizeFormula(origFormulaEl.value)) !== -1;
    origFormulaEl.classList.remove('ok','bad');
    origFormulaEl.classList.add(origOk ? 'ok' : 'bad');
    if(!origOk){ allOk = false; message = message || 'That\'s not the formula that applies here — check again.'; }

    var formulaRaw = formulaEl.value.trim().toLowerCase() === 'same' ? origFormulaEl.value : formulaEl.value;
    var formulaOk = FORMULA_OK.indexOf(normalizeFormula(formulaRaw)) !== -1;
    formulaEl.classList.remove('ok','bad');
    formulaEl.classList.add(formulaOk ? 'ok' : 'bad');
    if(!formulaOk){ allOk = false; message = message || 'The rearranged formula isn\'t quite right yet — try again.'; }

    var typed = normalizeNumber(answerEl.value);
    var answerOk = !isNaN(typed) && Math.abs(typed - current.correct) <= Math.max(0.02*Math.abs(current.correct), 0.03);
    answerEl.classList.remove('ok','bad');
    answerEl.classList.add(answerOk ? 'ok' : 'bad');
    if(!answerOk){ allOk = false; message = message || 'Not quite — check your substitution and try again.'; }

    var unitOk = identifyFieldOk('lambda', 'unit', answerUnitEl.value);
    answerUnitEl.classList.remove('ok','bad');
    answerUnitEl.classList.add(unitOk ? 'ok' : 'bad');
    if(!unitOk){ allOk = false; message = message || 'Don\'t forget to write the unit — check it matches your answer.'; }

    asked++;
    if(allOk){
      score++;
      updateScore();
      checkBtn.disabled = true;
      var correctModal = document.getElementById('correctModal');
      correctModal.hidden = false;
      setTimeout(function(){
        correctModal.hidden = true;
        if(asked >= ROUND_SIZE){ showRoundDone(); } else { newProblem(); }
      }, 1000);
    } else {
      feedback.textContent = message;
      asked--;
    }
  }

  function updateScore(){
    document.getElementById('scoreBadge-sopen').innerHTML = '<b>'+score+'</b> / '+ROUND_SIZE+' correct this round';
  }

  function showRoundDone(){
    var modal = document.getElementById('roundDoneModal');
    var title = document.getElementById('roundDoneTitle');
    var summary = document.getElementById('roundDoneSummary');
    var btn = document.getElementById('roundDoneBtn');
    if(score === ROUND_SIZE){
      title.textContent = "Perfect round!";
      summary.textContent = "All " + ROUND_SIZE + " correct — you've got λ = 2L/n solid in this mode.";
    } else {
      title.textContent = "Round complete";
      summary.textContent = score + " out of " + ROUND_SIZE + " correct. Have another go to lock it in.";
    }
    btn.onclick = function(){ modal.hidden = true; startRound(); };
    modal.hidden = false;
    btn.focus();
  }

  function startRound(){
    score = 0; asked = 0;
    updateScore();
    newProblem();
  }

  document.getElementById('newRoundBtn-sopen').addEventListener('click', startRound);

  var panel = document.querySelector('.topic-panel[data-topic="standing-open"]');
  var modeButtons = panel.querySelectorAll('.mode-btn');
  function updateModeButtons(){
    modeButtons.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-mode') === FIELD_MODE); });
  }
  modeButtons.forEach(function(b){
    b.addEventListener('click', function(){
      var m = b.getAttribute('data-mode');
      if(m === FIELD_MODE) return;
      FIELD_MODE = m;
      updateModeButtons();
      startRound();
    });
  });
  updateModeButtons();

  window.formulaLabTopics = window.formulaLabTopics || [];
  window.formulaLabTopics.push(startRound);

  startRound();
})();
</script>
